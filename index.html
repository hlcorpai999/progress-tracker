<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>先進發展部 專案暨任務管理系統</title>
<style>
:root{
  --bg:#f4f3ef; --sur:#ffffff; --sur1:#f1efe8; --sur2:#e9e7de;
  --bd:#e2e0d8; --bd2:#d3d1c7;
  --tx:#26251f; --tx2:#5f5e58; --tx3:#918f86;
  --red:#d64545; --red-bg:#fcebeb; --red-tx:#a32d2d;
  --amber:#e0a428; --amber-bg:#faeeda; --amber-tx:#854f0b;
  --green:#2f9e6e; --green-bg:#eaf3de; --green-tx:#27500a;
  --blue:#378add;
  --radius:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:14px;line-height:1.5}
button,select,input,textarea{font-family:inherit;font-size:13px;color:var(--tx)}
button{cursor:pointer;background:var(--sur);border:1px solid var(--bd2);border-radius:var(--radius);padding:6px 12px}
button:hover{background:var(--sur1)}
button.primary{background:var(--green);color:#fff;border-color:var(--green)}
button.danger-outline{border-color:var(--red);color:var(--red-tx)}
select,input[type=text],input:not([type]){border:1px solid var(--bd2);border-radius:var(--radius);padding:6px 8px;background:var(--sur)}
#app{max-width:1200px;margin:0 auto;padding:20px}

.card{background:var(--sur);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.top-card{padding:14px 20px;margin-bottom:12px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.title{font-size:19px;font-weight:600}
.subtitle{font-size:12px;color:var(--tx3);margin-top:4px}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync-dot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2)}
.sync-dot .d{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.dept-tag{font-size:12px;background:var(--green-bg);color:var(--green-tx);padding:4px 12px;border-radius:20px}
.admin-btn{position:relative}
.admin-badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}

.stats-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.stat-chip{background:var(--sur);border:1px solid var(--bd);border-radius:var(--radius);padding:10px;text-align:center}
.stat-chip .n{font-size:20px;font-weight:600}
.stat-chip .l{font-size:11px;color:var(--tx3)}
.stat-chip.done .n{color:var(--green-tx)} .stat-chip.done .l{color:var(--green-tx)}
.stat-chip.wip .n{color:var(--amber-tx)} .stat-chip.wip .l{color:var(--amber-tx)}
.stat-chip.late .n{color:var(--red-tx)} .stat-chip.late .l{color:var(--red-tx)}

.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-bar select{flex:1;min-width:120px}
.filter-bar input{flex:2;min-width:160px}

.sec-hd{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--sur1);cursor:pointer;user-select:none}
.sec-hd .chev{width:16px;height:16px;transition:transform .2s}
.sec-wrap.closed .chev{transform:rotate(-90deg)}
.sec-wrap.closed .sec-body{display:none}
.sec-title{font-size:15px;font-weight:600;flex:1}
.section-block{margin-bottom:14px}

.gen-table{width:100%;border-collapse:collapse}
.gen-table th{font-size:10px;text-transform:uppercase;color:var(--tx3);text-align:left;padding:6px 8px;background:var(--sur1);border-bottom:1px solid var(--bd)}
.gen-table td{padding:8px;border-bottom:1px solid var(--bd);vertical-align:top;font-size:13px}
.gen-table tr:last-child td{border-bottom:none}
.seq-col{width:34px;color:var(--tx3);text-align:center}
.due-col{width:60px;text-align:center}
.person-col{width:120px}
.status-col{width:78px}
.report-col{width:230px}
.add-row-link{padding:8px;font-size:12px;color:var(--tx3);cursor:pointer}
.add-row-link:hover{color:var(--tx)}

.proj-row{border-top:1px solid var(--bd)}
.proj-hd{display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer}
.proj-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.proj-name{font-size:14px;font-weight:600;flex:1}
.history-btn{font-size:11px;padding:4px 10px}

.wi-timeline{position:relative;padding:6px 16px 10px 36px}
.wi-timeline::before{content:"";position:absolute;left:22px;top:6px;bottom:6px;width:1.5px;background:var(--bd2)}
.wi-block{position:relative;margin-bottom:2px}
.wi-dot{position:absolute;left:-22px;top:11px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bd2);background:var(--sur);z-index:1}
.wi-dot.done{background:var(--green);border-color:var(--green)}
.wi-dot.active{border-color:var(--amber)}
.wi-hd{display:flex;align-items:center;gap:8px;padding:8px 6px;cursor:pointer;border-radius:var(--radius)}
.wi-hd:hover{background:var(--sur1)}
.wi-num{font-size:10px;font-weight:700;color:var(--tx3);width:16px}
.wi-label{font-size:13px;font-weight:600;flex:1}
.wi-badge{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--sur1);color:var(--tx3)}
.wi-badge.done{background:var(--green-bg);color:var(--green-tx)}
.wi-badge.wip{background:var(--amber-bg);color:var(--amber-tx)}
.wi-chev{width:14px;height:14px;transition:transform .2s;color:var(--tx3)}
.wi-block.closed .wi-chev{transform:rotate(-90deg)}
.wi-block.closed .wi-body{display:none}
.wi-body{padding:4px 6px 12px 6px}
.wi-inner{border:1px solid var(--bd2);border-radius:var(--radius);display:flex;overflow:hidden}
.deliv-col{width:170px;flex-shrink:0;border-right:1px solid var(--bd);background:var(--sur)}
.deliv-item{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--bd);cursor:pointer}
.deliv-item:last-child{border-bottom:none}
.deliv-item:hover{background:var(--sur1)}
.deliv-icon{width:18px;height:18px;border-radius:50%;background:var(--sur1);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:700}
.deliv-icon.todo{color:var(--red)}
.deliv-icon.wip{color:var(--amber)}
.deliv-icon.done{color:var(--green)}
.deliv-label{font-size:12px}
.deliv-label.done-tx{color:var(--tx3)}

.task-tbl{flex:1;min-width:0}
.t-row{display:flex;border-bottom:1px solid var(--bd)}
.t-row:last-child{border-bottom:none}
.t-cell{padding:8px;border-right:1px solid var(--bd)}
.t-cell:last-child{border-right:none}
.c-task{flex:1;min-width:0}
.c-task .ttl{font-size:13px;outline:none;min-height:18px}
.c-task .bul{font-size:11px;color:var(--tx2);margin-top:2px;padding-left:14px}
.c-task .bul li{margin-bottom:1px}
.c-due{width:52px;text-align:center;font-size:12px}
.c-person{width:110px}
.c-status{width:64px}
.c-report{width:1.3fr;flex:1.3;display:flex;align-items:flex-start;gap:4px}
.c-report .rtext{flex:1;font-size:12px;color:var(--tx2);outline:none;min-height:18px}
.c-act{width:26px;display:flex;align-items:center;justify-content:center}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;display:inline-block;white-space:nowrap}
.badge.todo{background:var(--sur1);color:var(--tx3)}
.badge.wip{background:var(--amber-bg);color:var(--amber-tx)}
.badge.late{background:var(--red-bg);color:var(--red-tx)}
.badge.done{background:var(--green-bg);color:var(--green-tx)}
.ptag{display:inline-flex;align-items:center;gap:3px;background:var(--sur1);border-radius:20px;padding:2px 6px 2px 8px;font-size:11px;margin:1px}
.ptag .x{cursor:pointer;color:var(--tx3);font-weight:700}
.p-add{font-size:11px;color:var(--tx3);border:1px dashed var(--bd2);border-radius:20px;padding:2px 8px;background:none;cursor:pointer}
.upd-btn{font-size:10px;padding:2px 7px;flex-shrink:0}
.del-btn{background:none;border:none;color:var(--tx3);font-size:12px;padding:2px}
.del-btn:hover{color:var(--red)}
.add-task-btn{font-size:12px;color:var(--tx3);padding:8px;cursor:pointer}
.add-task-btn:hover{color:var(--tx)}

.admin-controls{display:flex;gap:4px;margin-top:4px}
.admin-controls button{font-size:10px;padding:2px 6px}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-box{background:var(--sur);border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal-hd{padding:14px 20px;border-bottom:1px solid var(--bd);font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:16px 20px}
.mini-hd{font-size:11px;color:var(--tx3);margin:12px 0 6px}
.person-list-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}
.person-list-row:last-child{border-bottom:none}

.gate-screen{max-width:420px;margin:80px auto;text-align:center;padding:30px}
.gate-screen input{width:100%;padding:10px;margin:10px 0;border-radius:var(--radius);border:1px solid var(--bd2)}

.hist-table{width:100%;border-collapse:collapse}
.hist-table th{font-size:10px;color:var(--tx3);text-align:left;padding:6px 8px;background:var(--sur1);border-bottom:1px solid var(--bd)}
.hist-table td{padding:8px;border-bottom:1px solid var(--bd);font-size:12px;vertical-align:top}

@media print{
  .filter-bar,.stats-bar .stat-chip,.admin-btn,.add-task-btn,.del-btn,.p-add,.ptag .x,.upd-btn,.admin-controls,.history-btn{display:none!important}
  .sec-wrap.closed .sec-body,.wi-block.closed .wi-body{display:block!important}
}
</style>
</head>
<body>
<div id="app">載入中…</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script>
/* ============================================================
   先進發展部 專案暨任務管理系統
   ============================================================ */

const ADMIN_EMAIL = "richard1045745003@gmail.com";

/* ── 工作項目樣板（固定 7 項，含各自的執行綱要與結果清單）── */
const WORKITEMS = [
  {id:"W1", num:1, label:"產品設計與驗證", delivs:[
    {id:"d1",label:"樣品製作"},{id:"d2",label:"初始零件清單建立"},
    {id:"d3",label:"樣品工程圖建立"},{id:"d4",label:"零部件索樣與報價"}]},
  {id:"W2", num:2, label:"設計強度與疲勞測試", delivs:[
    {id:"d1",label:"第一次疲勞測試"},{id:"d2",label:"第二次疲勞測試"},
    {id:"d3",label:"第三次疲勞測試"},{id:"d4",label:"試產品疲勞測試"}]},
  {id:"W3", num:3, label:"品質與標準規範", delivs:[
    {id:"d1",label:"零部件重點規格訂定"},{id:"d2",label:"檢具設計與驗證"},
    {id:"d3",label:"量產用工程圖建立"}]},
  {id:"W4", num:4, label:"供應商協作管理", delivs:[
    {id:"d1",label:"模具與成品量產報價與比較"},{id:"d2",label:"報價單簽核與回傳"},
    {id:"d3",label:"認可報價單資料彙整歸檔"},{id:"d4",label:"開模進度及試產品質管理"},
    {id:"d5",label:"模具及加工成品限樣建立"},{id:"d6",label:"量化用檢具製作"}]},
  {id:"W5", num:5, label:"專案工程資料建構", delivs:[
    {id:"d1",label:"量產用零件清單建立"},{id:"d2",label:"量產用3D圖列管"},
    {id:"d3",label:"量產用工程圖列管"},{id:"d4",label:"作業指導書建立"},
    {id:"d5",label:"BOM及流程編號清單建立"}]},
  {id:"W6", num:6, label:"技術移轉", delivs:[
    {id:"d1",label:"試產說明會召開"},{id:"d2",label:"試產物料籌備與分工"},
    {id:"d3",label:"移轉資料修改與確認"}]},
  {id:"W7", num:7, label:"行銷相關輔助工作", delivs:[
    {id:"d1",label:"參展樣品需求"},{id:"d2",label:"產品說明文件"},{id:"d3",label:"認證資料"}]},
];
function workitemById(id){ return WORKITEMS.find(w=>w.id===id); }

const PAL = ["#2f9e6e","#378add","#a377d6","#e0824a","#d6588f"];

/* ── 全域資料（來自 Firebase）── */
let PROJECTS = [
  {id:"GX5", name:"GX5 四連桿避震座管", ci:0},
  {id:"EX",  name:"EX3/EX4/EX6 電動升降座管模組", ci:1},
];
let TASKS = [];        /* 開發專案任務: {id,proj,wi,task,detail,due,persons[],report,status,delayLocked} */
let GENERAL = [];       /* 一般事務工作: {id,seq,task,due,persons[],report,status,delayLocked} */
let DELIV_STATUS = {};  /* key proj__wi__deliv -> 待辦/進行中/完成 */
let HISTORY = {};       /* key proj 或 "__general" -> [{wiLabel,task,detail,completedDate,persons,report}] */
let USERS = {};         /* key = safe-email -> {email,nickname,status:"pending"/"approved",requestedAt,approvedAt} */
let nextId = 1000;

let currentUser = null; /* {email,nickname,isAdmin} 或 null */
let expandState = {};   /* 通用收合狀態: key -> bool(展開) */
let activeFilters = {proj:"",person:"",status:"",search:""};
let fbReady = false;

function ekey(email){ return email.replace(/\./g,"_dot_").replace(/@/g,"_at_").replace(/[#$\[\]]/g,"_"); }

function todayStr(){
  const n=new Date();
  return `${n.getFullYear()}/${String(n.getMonth()+1).padStart(2,"0")}/${String(n.getDate()).padStart(2,"0")}`;
}
function parseDue(d){
  if(!d) return null;
  const parts=d.split("/").map(Number);
  const now=new Date();
  if(parts.length===2){ return new Date(now.getFullYear(), parts[0]-1, parts[1]); }
  if(parts.length===3){ return new Date(parts[0], parts[1]-1, parts[2]); }
  return null;
}
function isOverdue(due){
  const dt=parseDue(due); if(!dt) return false;
  const now=new Date(); now.setHours(0,0,0,0);
  return dt.getTime() < now.getTime();
}
function todayDueDefault(){
  const n=new Date();
  return `${n.getMonth()+1}/${n.getDate()}`;
}

/* ── 狀態自動判斷：僅在資料載入(重新整理頁面)時執行一次 ── */
function recomputeAllStatuses(list){
  list.forEach(t=>{
    if(t.status==="完成") return;
    if(t.delayLocked){ t.status="延誤"; return; }
    const hasReport=(t.report||"").trim().length>0;
    if(!hasReport && isOverdue(t.due)){ t.delayLocked=true; t.status="延誤"; }
    else if(hasReport){ t.status="執行中"; }
    else { t.status="待執行"; }
  });
}

/* ============================================================
   Firebase
   ============================================================ */
const _fbConfig = {
  apiKey:            "AIzaSyCMdnDrXKGWjBSxSXIwJfWQQ9zpzLL7AE0",
  authDomain:        "hlcorp-ai.firebaseapp.com",
  databaseURL:       "https://hlcorp-ai-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "hlcorp-ai",
  storageBucket:     "hlcorp-ai.firebasestorage.app",
  messagingSenderId: "562386952535",
  appId:             "1:562386952535:web:f13e02396e8ce2a603de12",
};
firebase.initializeApp(_fbConfig);
try{ const appCheck=firebase.appCheck(); appCheck.activate('6LdOzhQtAAAAALhrmKVW_6LZXYSWKc5uuiKZbUl8', true); }catch(e){}
const _auth = firebase.auth();
const _db   = firebase.database();
const _ref  = _db.ref("taskSystemV2");

function _push(){
  _ref.set({
    PROJECTS, TASKS, GENERAL, DELIV_STATUS, HISTORY, USERS, nextId
  }).catch(e=>toast("儲存失敗，請檢查網路"));
}

_ref.on("value", snap=>{
  const d=snap.val();
  if(d){
    if(d.PROJECTS) PROJECTS=d.PROJECTS;
    if(d.TASKS) TASKS=d.TASKS;
    if(d.GENERAL) GENERAL=d.GENERAL;
    if(d.DELIV_STATUS) DELIV_STATUS=d.DELIV_STATUS;
    if(d.HISTORY) HISTORY=d.HISTORY;
    if(d.USERS) USERS=d.USERS;
    if(d.nextId) nextId=d.nextId;
  }
  if(!fbReady){
    fbReady=true;
    recomputeAllStatuses(TASKS);
    recomputeAllStatuses(GENERAL);
  }
  renderApp();
});

function signIn(){
  const provider=new firebase.auth.GoogleAuthProvider();
  _auth.signInWithPopup(provider).catch(e=>toast("登入失敗"));
}
function signOut(){ _auth.signOut(); }

_auth.onAuthStateChanged(user=>{
  if(!user){ currentUser=null; renderApp(); return; }
  const email=user.email;
  const isAdmin = email===ADMIN_EMAIL;
  const rec = USERS[ekey(email)];
  if(isAdmin){
    currentUser={email,nickname:"管理員",isAdmin:true};
  } else if(rec && rec.status==="approved"){
    currentUser={email,nickname:rec.nickname,isAdmin:false};
  } else if(rec && rec.status==="pending"){
    currentUser={email,nickname:rec.nickname,isAdmin:false,pending:true};
  } else {
    currentUser={email,nickname:null,isAdmin:false,needsNickname:true};
  }
  renderApp();
});

/* ============================================================
   小工具
   ============================================================ */
function toast(msg){
  let t=document.getElementById("toast-el");
  if(!t){ t=document.createElement("div"); t.id="toast-el";
    t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#26251f;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s";
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity="1";
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.opacity="0",1800);
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function approvedNicknames(){
  return Object.values(USERS).filter(u=>u.status==="approved").map(u=>u.nickname);
}
function pendingCount(){ return Object.values(USERS).filter(u=>u.status==="pending").length; }

/* ============================================================
   任務內容渲染（標題 + 條列細節）
   ============================================================ */
function taskContentHtml(task,detail){
  const lines=(detail||"").split("\n").map(s=>s.trim()).filter(Boolean);
  let h=`<div class="ttl" contenteditable="true" spellcheck="false" data-field="task">${esc(task)}</div>`;
  if(lines.length){
    h+=`<ul class="bul">${lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`;
  }
  return h;
}

/* ============================================================
   任務列（開發專案 / 一般事務工作 共用）
   ============================================================ */
function taskRowHtml(t, kind, projId, wiId){
  const badgeCls = t.status==="完成"?"done":t.status==="執行中"?"wip":t.status==="延誤"?"late":"todo";
  const personsHtml = (t.persons||[]).map((p,i)=>
    `<span class="ptag">${esc(p)}<span class="x" onclick="removePerson('${kind}',${t.id},${i})">×</span></span>`
  ).join("");
  const isLate = t.status==="延誤";
  let adminExtra="";
  if(currentUser && currentUser.isAdmin){
    let btns=`<button onclick="adminComplete('${kind}','${projId||""}',${t.id})">標記完成</button>`;
    if(isLate){
      btns = `<button onclick="adminSetStatus('${kind}',${t.id},'待執行')">待執行</button>
              <button onclick="adminSetStatus('${kind}',${t.id},'執行中')">執行中</button>` + btns;
    }
    adminExtra = `<div class="admin-controls">${btns}</div>`;
  }
  return `<div class="t-row" data-id="${t.id}">
    <div class="t-cell c-task">
      ${taskContentHtml(t.task,t.detail)}
      ${adminExtra}
    </div>
    <div class="t-cell c-due">
      <div contenteditable="true" spellcheck="false" data-field="due">${esc(t.due)||"—"}</div>
    </div>
    <div class="t-cell c-person">
      ${personsHtml}
      <button class="p-add" onclick="openPersonPicker(event,'${kind}',${t.id})">＋</button>
    </div>
    <div class="t-cell c-status"><span class="badge ${badgeCls}">${t.status}</span></div>
    <div class="t-cell c-report">
      <div class="rtext" contenteditable="true" spellcheck="false" data-field="report">${esc(t.report)}</div>
      <button class="upd-btn" onclick="clearReport('${kind}',${t.id})">更新</button>
    </div>
    <div class="t-cell c-act"><button class="del-btn" onclick="deleteTask('${kind}',${t.id})">✕</button></div>
  </div>`;
}

/* ============================================================
   一般事務工作
   ============================================================ */
function renderGeneralSection(){
  const key="__general";
  const closed = expandState[key]===false;
  const list = GENERAL.filter(taskVisible);
  const rows = list.map(t=>`<tr data-id="${t.id}">
    <td class="seq-col">${t.seq}</td>
    <td>${taskContentHtml(t.task,t.detail)}</td>
    <td class="due-col">${esc(t.due)||"—"}</td>
    <td class="person-col">${(t.persons||[]).map((p,i)=>`<span class="ptag">${esc(p)}<span class="x" onclick="removePerson('general',${t.id},${i})">×</span></span>`).join("")}<button class="p-add" onclick="openPersonPicker(event,'general',${t.id})">＋</button></td>
    <td class="status-col"><span class="badge ${t.status==='完成'?'done':t.status==='執行中'?'wip':t.status==='延誤'?'late':'todo'}">${t.status}</span>${currentUser&&currentUser.isAdmin?`<div class="admin-controls">${t.status==='延誤'?`<button onclick="adminSetStatus('general',${t.id},'待執行')">待執行</button><button onclick="adminSetStatus('general',${t.id},'執行中')">執行中</button>`:""}<button onclick="adminComplete('general','',${t.id})">完成</button></div>`:""}</td>
    <td class="report-col"><div style="display:flex;gap:4px"><div class="rtext" contenteditable="true" data-field="report" style="flex:1">${esc(t.report)}</div><button class="upd-btn" onclick="clearReport('general',${t.id})">更新</button></div></td>
  </tr>`).join("");

  return `<div class="card section-block sec-wrap ${closed?"closed":""}" data-key="${key}">
    <div class="sec-hd" onclick="toggleSectionKey('${key}',this)">
      <svg class="chev" viewBox="0 0 14 14"><path d="M2 5l5 5 5-5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <span class="sec-title">一般事務工作</span>
      <button class="history-btn danger-outline" onclick="event.stopPropagation();openHistory('__general')">歷程</button>
    </div>
    <div class="sec-body">
      <table class="gen-table">
        <thead><tr><th>序號</th><th>工作內容</th><th>截止日期</th><th>責任人</th><th>執行狀態</th><th>執行情況說明</th></tr></thead>
        <tbody id="general-rows">${rows}</tbody>
      </table>
      <div class="add-row-link" onclick="addGeneralTask()">＋ 新增事務</div>
    </div>
  </div>`;
}

/* ============================================================
   開發專案
   ============================================================ */
function taskVisible(t){
  if(activeFilters.status && t.status!==activeFilters.status) return false;
  if(activeFilters.person && !(t.persons||[]).includes(activeFilters.person)) return false;
  if(activeFilters.search){
    const s=activeFilters.search.toLowerCase();
    const hay=(t.task+" "+(t.detail||"")+" "+(t.persons||[]).join(",")).toLowerCase();
    if(!hay.includes(s)) return false;
  }
  return true;
}
function delivStatusOf(proj,wi,deliv){ return DELIV_STATUS[proj+"__"+wi+"__"+deliv] || "待辦"; }
function workitemBadge(proj,wi){
  const w=workitemById(wi);
  const total=w.delivs.length;
  const done=w.delivs.filter(d=>delivStatusOf(proj,wi,d.id)==="完成").length;
  return {done,total};
}
function workitemState(proj,wi){
  const {done,total}=workitemBadge(proj,wi);
  if(done===total) return "done";
  if(done>0) return "active";
  const w=workitemById(wi);
  const anyWip=w.delivs.some(d=>delivStatusOf(proj,wi,d.id)==="進行中");
  return anyWip?"active":"none";
}
function delivIconHtml(st){
  if(st==="完成") return `<div class="deliv-icon done">○</div>`;
  if(st==="進行中") return `<div class="deliv-icon wip">▶</div>`;
  return `<div class="deliv-icon todo">✕</div>`;
}
function renderWorkitem(proj,wi){
  const w=workitemById(wi);
  const key=proj+"__"+wi;
  const closed = expandState[key]===false ? true : (expandState[key]===true?false:workitemState(proj,wi)!=="active");
  const st=workitemState(proj,wi);
  const {done,total}=workitemBadge(proj,wi);
  const dotCls = st==="done"?"done":st==="active"?"active":"";
  const badgeCls = st==="done"?"done":st==="active"?"wip":"";

  const delivHtml = w.delivs.map(d=>{
    const ds=delivStatusOf(proj,wi,d.id);
    return `<div class="deliv-item" onclick="cycleDeliv('${proj}','${wi}','${d.id}')">
      ${delivIconHtml(ds)}
      <span class="deliv-label ${ds==='完成'?'done-tx':''}">${esc(d.label)}</span>
    </div>`;
  }).join("");

  const tasks = TASKS.filter(t=>t.proj===proj && t.wi===wi && taskVisible(t));
  const taskRows = tasks.map(t=>taskRowHtml(t,'proj',proj,wi)).join("");

  return `<div class="wi-block ${closed?"closed":""}" data-key="${key}">
    <div class="wi-dot ${dotCls}"></div>
    <div class="wi-hd" onclick="toggleWorkitem('${key}',this)">
      <span class="wi-num">${w.num}</span>
      <span class="wi-label">${esc(w.label)}</span>
      <span class="wi-badge ${badgeCls}">${done}/${total}</span>
      <svg class="wi-chev" viewBox="0 0 14 14"><path d="M2 5l5 5 5-5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    </div>
    <div class="wi-body">
      <div class="wi-inner">
        <div class="deliv-col">${delivHtml}</div>
        <div class="task-tbl">
          ${taskRows}
          <div class="add-task-btn" onclick="addProjectTask('${proj}','${wi}')">＋ 新增作業</div>
        </div>
      </div>
    </div>
  </div>`;
}
function renderProject(proj){
  return `<div class="proj-row">
    <div class="proj-hd" onclick="toggleWorkitem('proj_${proj.id}',this,true)">
      <span class="proj-dot" style="background:${PAL[proj.ci%PAL.length]}"></span>
      <span class="proj-name">${esc(proj.name)}</span>
      <button class="history-btn danger-outline" onclick="event.stopPropagation();openHistory('${proj.id}')">歷程</button>
    </div>
    <div class="wi-timeline">
      ${WORKITEMS.map(w=>renderWorkitem(proj.id,w.id)).join("")}
    </div>
  </div>`;
}
function renderDevSection(){
  const key="__dev";
  const closed = expandState[key]===false;
  const filteredProjects = activeFilters.proj ? PROJECTS.filter(p=>p.id===activeFilters.proj) : PROJECTS;
  return `<div class="card sec-wrap ${closed?"closed":""}" data-key="${key}">
    <div class="sec-hd" onclick="toggleSectionKey('${key}',this)">
      <svg class="chev" viewBox="0 0 14 14"><path d="M2 5l5 5 5-5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <span class="sec-title">開發專案</span>
    </div>
    <div class="sec-body">
      ${filteredProjects.map(renderProject).join("")}
    </div>
  </div>`;
}

/* ============================================================
   歷程（History）
   ============================================================ */
function openHistory(scopeId){
  const entries = HISTORY[scopeId] || [];
  const rows = entries.map(e=>`<tr>
    <td>${esc(e.wiLabel||"")}</td>
    <td>${esc(e.task)}${e.detail?`<div style="font-size:11px;color:var(--tx3)">${esc(e.detail)}</div>`:""}</td>
    <td>${esc(e.completedDate)}</td>
    <td>${esc((e.persons||[]).join("、"))}</td>
    <td>${esc(e.report||"—")}</td>
  </tr>`).join("");
  const title = scopeId==="__general" ? "一般事務工作 歷程" : ((PROJECTS.find(p=>p.id===scopeId)||{}).name||scopeId)+" 歷程";
  showModal(`
    <div class="modal-hd"><span>${title}</span><button onclick="closeModal()">關閉</button></div>
    <div class="modal-body">
      <table class="hist-table">
        <thead><tr><th>工作項目</th><th>作業內容</th><th>完成日期</th><th>責任人</th><th>執行情況說明</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5" style="color:var(--tx3)">尚無歷程紀錄</td></tr>`}</tbody>
      </table>
    </div>`);
}

/* ============================================================
   Modal / Admin Panel
   ============================================================ */
function showModal(inner){
  let m=document.getElementById("modal-root");
  if(!m){ m=document.createElement("div"); m.id="modal-root"; document.body.appendChild(m); }
  m.innerHTML = `<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal-box">${inner}</div></div>`;
}
function closeModal(){ const m=document.getElementById("modal-root"); if(m) m.innerHTML=""; }

function openAdminPanel(){
  const pending = Object.entries(USERS).filter(([k,u])=>u.status==="pending");
  const approved = Object.entries(USERS).filter(([k,u])=>u.status==="approved");
  const pendingHtml = pending.length ? pending.map(([k,u])=>`
    <div class="person-list-row">
      <div><div style="font-weight:500">${esc(u.nickname)}</div><div style="font-size:11px;color:var(--tx3)">${esc(u.email)}</div></div>
      <div style="display:flex;gap:6px">
        <button class="primary" onclick="approveUser('${k}')">核准</button>
        <button onclick="rejectUser('${k}')">拒絕</button>
      </div>
    </div>`).join("") : `<div style="font-size:12px;color:var(--tx3)">目前沒有待審核申請</div>`;
  const approvedHtml = approved.length ? approved.map(([k,u])=>`
    <div class="person-list-row">
      <span>${esc(u.nickname)} <span style="font-size:11px;color:var(--tx3)">${esc(u.approvedAt||"")} 核准</span></span>
      <button class="danger-outline" onclick="removeUser('${k}')">移除</button>
    </div>`).join("") : `<div style="font-size:12px;color:var(--tx3)">目前沒有已核准工程師</div>`;
  showModal(`
    <div class="modal-hd"><span>帳號管理</span><button onclick="closeModal()">關閉</button></div>
    <div class="modal-body">
      <div class="mini-hd">待審核申請 · ${pending.length}</div>
      ${pendingHtml}
      <div class="mini-hd">已核准工程師 · ${approved.length}</div>
      ${approvedHtml}
    </div>`);
}
function approveUser(k){ if(USERS[k]){ USERS[k].status="approved"; USERS[k].approvedAt=todayStr(); _push(); openAdminPanel(); renderApp(); toast("已核准"); } }
function rejectUser(k){ if(USERS[k]){ delete USERS[k]; _push(); openAdminPanel(); renderApp(); toast("已拒絕"); } }
function removeUser(k){
  if(!confirm("確定要移除這位工程師的編輯權限嗎？")) return;
  if(USERS[k]){ delete USERS[k]; _push(); openAdminPanel(); renderApp(); toast("已移除"); }
}

/* ============================================================
   人員挑選 popover
   ============================================================ */
function openPersonPicker(evt,kind,taskId){
  evt.stopPropagation();
  const names = approvedNicknames();
  const list = TASKS.concat(GENERAL).find(t=>t.id===taskId);
  const already = list ? (list.persons||[]) : [];
  const options = names.filter(n=>!already.includes(n));
  let box=document.getElementById("person-pop");
  if(box) box.remove();
  box=document.createElement("div");
  box.id="person-pop";
  box.style.cssText="position:absolute;background:var(--sur);border:1px solid var(--bd2);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:200;min-width:120px;max-height:200px;overflow:auto";
  box.innerHTML = options.length ? options.map(n=>`<div style="padding:6px 12px;font-size:12px;cursor:pointer" onmouseover="this.style.background='var(--sur1)'" onmouseout="this.style.background=''" onclick="addPerson('${kind}',${taskId},'${n.replace(/'/g,"\\'")}')">${esc(n)}</div>`).join("")
    : `<div style="padding:6px 12px;font-size:12px;color:var(--tx3)">沒有可加入的人</div>`;
  document.body.appendChild(box);
  const r=evt.target.getBoundingClientRect();
  box.style.left=(r.left+window.scrollX)+"px";
  box.style.top=(r.bottom+window.scrollY+4)+"px";
  setTimeout(()=>{ document.addEventListener("click", function h(e){ if(!box.contains(e.target)){ box.remove(); document.removeEventListener("click",h);} }); },0);
}
function findTaskList(kind){ return kind==="general" ? GENERAL : TASKS; }
function addPerson(kind,taskId,name){
  const t=findTaskList(kind).find(x=>x.id===taskId);
  if(t){ t.persons=t.persons||[]; if(!t.persons.includes(name)) t.persons.push(name); _push(); renderApp(); }
  const box=document.getElementById("person-pop"); if(box) box.remove();
}
function removePerson(kind,taskId,idx){
  const t=findTaskList(kind).find(x=>x.id===taskId);
  if(t && t.persons){ t.persons.splice(idx,1); _push(); renderApp(); }
}

/* ============================================================
   任務動作
   ============================================================ */
function addProjectTask(proj,wi){
  const t={id:nextId++,proj,wi,task:"新作業",detail:"",due:todayDueDefault(),persons:[],report:"",status:"待執行",delayLocked:false};
  TASKS.push(t); _push(); renderApp();
}
function addGeneralTask(){
  const seq=GENERAL.length? Math.max(...GENERAL.map(g=>g.seq))+1 : 1;
  const t={id:nextId++,seq,task:"新事務",detail:"",due:todayDueDefault(),persons:[],report:"",status:"待執行",delayLocked:false};
  GENERAL.push(t); _push(); renderApp();
}
function deleteTask(kind,id){
  if(!confirm("確定要刪除這筆任務？")) return;
  if(kind==="general"){ GENERAL=GENERAL.filter(t=>t.id!==id); } else { TASKS=TASKS.filter(t=>t.id!==id); }
  _push(); renderApp();
}
function clearReport(kind,id){
  const t=findTaskList(kind).find(x=>x.id===id);
  if(t){ t.report=""; _push(); renderApp(); }
}
function adminSetStatus(kind,id,newStatus){
  if(!currentUser||!currentUser.isAdmin) return;
  const t=findTaskList(kind).find(x=>x.id===id);
  if(t){ t.status=newStatus; t.delayLocked=false; _push(); renderApp(); }
}
function adminComplete(kind,proj,id){
  if(!currentUser||!currentUser.isAdmin) return;
  if(kind==="general"){
    const idx=GENERAL.findIndex(t=>t.id===id); if(idx<0) return;
    const t=GENERAL[idx];
    HISTORY["__general"]=HISTORY["__general"]||[];
    HISTORY["__general"].push({wiLabel:"",task:t.task,detail:t.detail,completedDate:todayStr(),persons:t.persons,report:t.report});
    GENERAL.splice(idx,1);
  } else {
    const idx=TASKS.findIndex(t=>t.id===id); if(idx<0) return;
    const t=TASKS[idx];
    const w=workitemById(t.wi);
    HISTORY[t.proj]=HISTORY[t.proj]||[];
    HISTORY[t.proj].push({wiLabel:w?w.label:"",task:t.task,detail:t.detail,completedDate:todayStr(),persons:t.persons,report:t.report});
    TASKS.splice(idx,1);
  }
  _push(); renderApp(); toast("已歸檔至歷程");
}
function cycleDeliv(proj,wi,deliv){
  if(!currentUser||currentUser.pending||currentUser.needsNickname) return;
  const key=proj+"__"+wi+"__"+deliv;
  const cur=DELIV_STATUS[key]||"待辦";
  const next = cur==="待辦"?"進行中":cur==="進行中"?"完成":"待辦";
  DELIV_STATUS[key]=next; _push(); renderApp();
}

/* 欄位即時編輯儲存 (contenteditable blur) */
document.addEventListener("blur", function(e){
  const el=e.target;
  if(!(el instanceof HTMLElement)) return;
  const field=el.dataset && el.dataset.field;
  if(!field) return;
  const row=el.closest("[data-id]"); if(!row) return;
  const id=parseInt(row.dataset.id);
  let list = TASKS.find(x=>x.id===id) ? TASKS : (GENERAL.find(x=>x.id===id)?GENERAL:null);
  if(!list) return;
  const t=list.find(x=>x.id===id);
  if(!t) return;
  const val = el.innerText.trim();
  if(field==="task") t.task=val;
  else if(field==="due") t.due=val;
  else if(field==="report") t.report=val;
  _push();
}, true);

/* ============================================================
   收合狀態
   ============================================================ */
function toggleSectionKey(key,el){
  expandState[key] = expandState[key]===false ? true : (expandState[key]===undefined?false:!expandState[key]);
  renderApp();
}
function toggleWorkitem(key,el,isProj){
  if(isProj){
    expandState[key] = expandState[key]===false ? true : (expandState[key]===undefined?false:!expandState[key]);
  } else {
    const cur = expandState[key]===undefined ? (workitemState(...key.split("__"))!=="active") : !expandState[key];
    expandState[key] = !cur;
  }
  renderApp();
}

/* ============================================================
   Header / Stats / Filters
   ============================================================ */
function renderHeader(){
  const pc=pendingCount();
  const adminBtn = currentUser && currentUser.isAdmin ? `
    <div class="admin-btn">
      <button onclick="openAdminPanel()">⚙ 管理</button>
      ${pc>0?`<span class="admin-badge">${pc}</span>`:""}
    </div>` : "";
  return `<div class="card top-card">
    <div class="top-row">
      <div>
        <div class="title">先進發展部 專案暨任務管理系統</div>
        <div class="subtitle">日期：${todayStr()}</div>
      </div>
      <div class="top-actions">
        <span class="sync-dot"><span class="d"></span>已同步</span>
        <span class="dept-tag">台灣信隆先進發展部</span>
        <button onclick="window.print()">列印</button>
        ${adminBtn}
        ${currentUser?`<button onclick="signOut()">登出 (${esc(currentUser.nickname||currentUser.email)})</button>`:""}
      </div>
    </div>
  </div>`;
}
function renderStats(){
  const all=TASKS.concat(GENERAL);
  const c={done:0,wip:0,late:0,todo:0};
  all.forEach(t=>{
    if(t.status==="完成") c.done++;
    else if(t.status==="執行中") c.wip++;
    else if(t.status==="延誤") c.late++;
    else c.todo++;
  });
  return `<div class="stats-bar">
    <div class="stat-chip"><div class="n">${all.length}</div><div class="l">顯示任務</div></div>
    <div class="stat-chip done"><div class="n">${c.done}</div><div class="l">已完成</div></div>
    <div class="stat-chip wip"><div class="n">${c.wip}</div><div class="l">執行中</div></div>
    <div class="stat-chip late"><div class="n">${c.late}</div><div class="l">延誤</div></div>
    <div class="stat-chip"><div class="n">${c.todo}</div><div class="l">待執行</div></div>
  </div>`;
}
function renderFilters(){
  const persons = approvedNicknames();
  return `<div class="filter-bar">
    <select onchange="activeFilters.proj=this.value;renderApp()">
      <option value="">全部專案</option>
      ${PROJECTS.map(p=>`<option value="${p.id}" ${activeFilters.proj===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}
    </select>
    <select onchange="activeFilters.person=this.value;renderApp()">
      <option value="">全部負責人</option>
      ${persons.map(n=>`<option value="${n}" ${activeFilters.person===n?"selected":""}>${esc(n)}</option>`).join("")}
    </select>
    <select onchange="activeFilters.status=this.value;renderApp()">
      <option value="">全部狀態</option>
      <option ${activeFilters.status==="待執行"?"selected":""}>待執行</option>
      <option ${activeFilters.status==="執行中"?"selected":""}>執行中</option>
      <option ${activeFilters.status==="延誤"?"selected":""}>延誤</option>
    </select>
    <input placeholder="搜尋任務、負責人…" value="${esc(activeFilters.search)}" oninput="activeFilters.search=this.value;renderApp()">
  </div>`;
}

/* ============================================================
   登入前置畫面
   ============================================================ */
function renderGate(){
  if(!currentUser){
    return `<div class="gate-screen card">
      <div class="title" style="margin-bottom:16px">先進發展部 專案暨任務管理系統</div>
      <button class="primary" onclick="signIn()">使用 Google 帳號登入</button>
    </div>`;
  }
  if(currentUser.needsNickname){
    return `<div class="gate-screen card">
      <div class="title">設定暱稱</div>
      <p style="font-size:13px;color:var(--tx2)">第一次登入，請輸入您的暱稱（將顯示給其他同仁）</p>
      <input id="nick-input" placeholder="輸入暱稱">
      <button class="primary" onclick="submitNickname()">送出申請</button>
    </div>`;
  }
  if(currentUser.pending){
    return `<div class="gate-screen card">
      <div class="title">審核中</div>
      <p style="font-size:13px;color:var(--tx2)">您的帳號（${esc(currentUser.nickname)}）正在等待管理員核准，核准後即可開始使用。</p>
      <button onclick="signOut()">登出</button>
    </div>`;
  }
  return null;
}
function submitNickname(){
  const val=document.getElementById("nick-input").value.trim();
  if(!val){ toast("請輸入暱稱"); return; }
  const dup = Object.values(USERS).some(u=>u.nickname===val) || val==="管理員";
  if(dup){ toast("暱稱重複，請重新輸入"); return; }
  const k=ekey(currentUser.email);
  USERS[k]={email:currentUser.email,nickname:val,status:"pending",requestedAt:todayStr()};
  _push();
  currentUser.nickname=val; currentUser.pending=true; currentUser.needsNickname=false;
  renderApp();
}

/* ============================================================
   主渲染
   ============================================================ */
/* 除錯輔助：瀏覽器主控台可執行 __debug() 查看目前完整狀態 */
function __debug(){ return {PROJECTS,TASKS,GENERAL,DELIV_STATUS,HISTORY,USERS,currentUser,expandState}; }

function renderApp(){
  const root=document.getElementById("app");
  if(!fbReady){ root.innerHTML="載入中…"; return; }
  const gate=renderGate();
  if(gate){ root.innerHTML=gate; return; }
  root.innerHTML = renderHeader() + renderStats() + renderFilters() + renderGeneralSection() + renderDevSection();
}
</script>
</body>
</html>
