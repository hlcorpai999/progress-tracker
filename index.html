/* 新專案自動配色：用黃金角旋轉色相，確保新舊專案顏色彼此有明顯區隔、不重複、不相近 */
function nextProjectColor(){
  const idx = PROJECTS.length;
  const hue = Math.round((idx * 137.508) % 360);
  return `hsl(${hue},60%,42%)`;
}
function projectColor(proj){
  return proj.color || PAL[proj.ci % PAL.length];
}

function ekey(email){ return email.replace(/\./g,"_dot_").replace(/@/g,"_at_").replace(/[#$\[\]]/g,"_"); }

function todayStr(){
  const n=new Date();
  return `${n.getFullYear()}/${String(n.getMonth()+1).padStart(2,"0")}/${String(n.getDate()).padStart(2,"0")}`;
}
function parseDue(d){
  if(!d) return null;
  const parts=d.split("/").map(Number);
  const now=new Date();
  if(parts.length===2){ return new Date(now.getFullYear(), parts[0]-1, parts[1]); }
  if(parts.length===3){ return new Date(parts[0], parts[1]-1, parts[2]); }
  return null;
}
function isOverdue(due){
  const dt=parseDue(due); if(!dt) return false;
  const now=new Date(); now.setHours(0,0,0,0);
  return dt.getTime() < now.getTime();
}
function todayDueDefault(){
  return todayStr(); /* 改為完整 YYYY/MM/DD 格式 */
}
function todayISO(){
  const n=new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
}
/* 內部儲存格式 YYYY/MM/DD ←→ <input type="date"> 所需的 YYYY-MM-DD 格式，互相轉換 */
function dueToISO(due){
  if(!due) return "";
  const parts=due.split("/").map(s=>s.trim());
  if(parts.length===3){
    return `${parts[0].padStart(4,"0")}-${parts[1].padStart(2,"0")}-${parts[2].padStart(2,"0")}`;
  }
  if(parts.length===2){ /* 相容舊資料的 M/D 格式，補上今年年份 */
    const y=new Date().getFullYear();
    return `${y}-${parts[0].padStart(2,"0")}-${parts[1].padStart(2,"0")}`;
  }
  return "";
}
function isoToDue(iso){
  if(!iso) return "";
  const p=iso.split("-");
  if(p.length!==3) return "";
  return `${p[0]}/${p[1]}/${p[2]}`;
}
/* 統一的「不可早於今天」防呆：回傳一個保證不早於今天的 YYYY/MM/DD 字串 */
function clampDueNotPast(isoVal){
  if(!isoVal || isoVal < todayISO()){
    if(isoVal) toast("截止日期不能早於今天，已自動調整為今天");
    return todayDueDefault();
  }
  return isoToDue(isoVal);
}

/* ── 狀態自動判斷：僅在資料載入(重新整理頁面)時執行一次 ── */
function recomputeOne(t){
  if(t.status==="完成") return;
  if(t.delayLocked){ t.status="延誤"; return; }
  const hasReport=(t.report||"").trim().length>0;
  if(!hasReport && isOverdue(t.due)){ t.delayLocked=true; t.status="延誤"; }
  else if(hasReport){ t.status="執行中"; }
  else { t.status="待執行"; }
}
function recomputeAllStatuses(list){
  list.forEach(recomputeOne);
}

let _online = true; /* 真實連線狀態偵測的結果，預設先假設為已連線 */

/* 防呆：Firebase 不接受任何屬性值為 undefined，寫入前一律先深度清除，
   避免日後任何欄位不慎變成 undefined 時，整批寫入被無聲無息拒絕 */
function stripUndefinedDeep(val){
  if(Array.isArray(val)) return val.map(stripUndefinedDeep);
  if(val && typeof val==="object"){
    const out={};
    Object.keys(val).forEach(k=>{
      if(val[k]!==undefined) out[k]=stripUndefinedDeep(val[k]);
    });
    return out;
  }
  return val;
}

let _suppressNextDataEcho=false, _suppressNextUsersEcho=false;

/* ============================================================
   資料寫入：一律「每筆各自獨立存取」，絕不整包覆蓋整個清單。
   這是解決多人同時操作時互相覆蓋彼此異動的關鍵——
   Firebase 對「各自獨立路徑」的寫入本身就有保護，不會互相干擾。
   ============================================================ */
function _writeDataPath(relPath, value){
  _suppressNextDataEcho=true;
  const p = (value===null) ? _dataRef.child(relPath).remove() : _dataRef.child(relPath).set(stripUndefinedDeep(value));
  p.catch(e=>toast("儲存失敗，請檢查網路"));
}
function newDataId(bucket){
  /* 用 Firebase 自帶的 push() 產生全域唯一的 id，取代原本容易在多人同時操作時
     算出同一個編號的手動計數器(nextId)，徹底避免「兩人同時新增，拿到同一個id」的碰撞 */
  return _dataRef.child(bucket).push().key;
}
function writeTask(t){ _writeDataPath("TASKS/"+t.id, t); }
function removeTaskRecord(id){ _writeDataPath("TASKS/"+id, null); }
function writeGeneral(t){ _writeDataPath("GENERAL/"+t.id, t); }
function removeGeneralRecord(id){ _writeDataPath("GENERAL/"+id, null); }
function writeProjectRecord(p){ _writeDataPath("PROJECTS/"+p.id, p); }
function removeProjectRecord(id){ _writeDataPath("PROJECTS/"+id, null); }
function writeDelivStatus(key,val){ _writeDataPath("DELIV_STATUS/"+key, val); }
function addHistoryEntry(scopeId, entry){
  const key = newDataId("HISTORY/"+scopeId);
  entry = Object.assign({_key:key}, entry);
  HISTORY[scopeId] = HISTORY[scopeId] || [];
  HISTORY[scopeId].push(entry); /* 本地立即更新，畫面馬上反映，不用等資料庫回應 */
  _writeDataPath("HISTORY/"+scopeId+"/"+key, entry);
}
function removeHistoryEntry(scopeId, entryKey){ _writeDataPath("HISTORY/"+scopeId+"/"+entryKey, null); }

/* 使用者名單：每次只寫入「單一一筆」使用者的子節點，絕不整包覆蓋整份名單。
   這是配合安全規則的必要做法——規則是「每個人只能寫自己那一筆」，
   若整包覆蓋會同時觸碰到別人的資料，導致整個寫入被規則擋下。
   dataOrNull 傳 null 代表要移除這筆使用者資料。 */
function pushUserRecord(uid, dataOrNull){
  _suppressNextUsersEcho=true;
  const p = (dataOrNull===null) ? _usersRef.child(uid).remove() : _usersRef.child(uid).set(stripUndefinedDeep(dataOrNull));
  p.catch(e=>toast("儲存失敗，請檢查網路"));
}

let dataReady=false, usersReady=false, usersListenerAttached=false, dataListenerAttached=false;
function _maybeReady(){
  /* 待審核/未設定暱稱的使用者不需要任務資料就能顯示畫面，
     只有「管理員」或「已核准」的人才需要等 data 讀取完成 */
  const needsData = currentUser && (currentUser.isAdmin || (!currentUser.pending && !currentUser.needsNickname));
  if(usersReady && (!needsData || dataReady) && !fbReady){
    fbReady=true;
    recomputeAllStatuses(TASKS);
    recomputeAllStatuses(GENERAL);
  }
  renderApp();
}
let _authUser = null; /* 目前登入的 firebase auth user 物件 */

function recomputeCurrentUser(){
  if(!_authUser){ currentUser=null; return; }
  const email=_authUser.email, uid=_authUser.uid, displayName=_authUser.displayName||email;
  const isAdmin = email===ADMIN_EMAIL;
  const rec = USERS[uid];
  if(isAdmin){
    currentUser={email,uid,displayName,nickname:"管理員",isAdmin:true};
  } else if(rec && rec.status==="approved"){
    currentUser={email,uid,displayName,nickname:rec.nickname,isAdmin:false};
  } else if(rec && rec.status==="pending"){
    currentUser={email,uid,displayName,nickname:rec.nickname,isAdmin:false,pending:true};
  } else {
    currentUser={email,uid,displayName,nickname:null,isAdmin:false,needsNickname:true};
  }
  /* 只有管理員或已核准的人，規則才允許讀取任務資料 */
  if(currentUser.isAdmin || (!currentUser.pending && !currentUser.needsNickname)){
    ensureDataListener();
  }
}

function ensureUsersListener(){
  if(usersListenerAttached) return;
  usersListenerAttached=true;
  _usersRef.on("value", snap=>{
    USERS = snap.val() || {};
    usersReady=true;
    recomputeCurrentUser(); /* 名單更新時重新判斷身份，避免競速卡住 */
    if(_suppressNextUsersEcho){ _suppressNextUsersEcho=false; return; }
    _maybeReady();
  }, err=>{
    usersReady=true; /* 讀取被拒絕(例如尚未登入)也視為完成一次，避免卡住 */
    _lastError = "users: " + (err && err.message ? err.message : err);
    _maybeReady();
  });
}
function ensureDataListener(){
  if(dataListenerAttached) return;
  dataListenerAttached=true;
  _dataRef.on("value", snap=>{
    const d=snap.val();
    if(d){
      /* Object.keys(...).map(...) 對「舊格式的陣列」跟「新格式的各自獨立子節點」
         都適用，兩種資料可以平順接軌，不需要手動搬移既有資料 */
      if(d.PROJECTS) PROJECTS = Object.keys(d.PROJECTS).map(k=>d.PROJECTS[k]);
      if(d.TASKS)    TASKS    = Object.keys(d.TASKS).map(k=>d.TASKS[k]);
      if(d.GENERAL)  GENERAL  = Object.keys(d.GENERAL).map(k=>d.GENERAL[k]);
      if(d.DELIV_STATUS) DELIV_STATUS=d.DELIV_STATUS;
      if(d.HISTORY){
        HISTORY = {};
        Object.keys(d.HISTORY).forEach(scopeId=>{
          const raw = d.HISTORY[scopeId];
          HISTORY[scopeId] = Object.keys(raw).map(k=>Object.assign({_key:k}, raw[k]));
        });
      }
    }
    dataReady=true;
    if(_suppressNextDataEcho){ _suppressNextDataEcho=false; return; }
    _maybeReady();
  }, err=>{
    dataReady=true;
    _lastError = "data: " + (err && err.message ? err.message : err);
    _maybeReady();
  });
}

function signIn(){
  const provider=new firebase.auth.GoogleAuthProvider();
  _auth.signInWithPopup(provider).catch(e=>toast("登入失敗"));
}
function signOut(){ _auth.signOut(); }

_auth.onAuthStateChanged(user=>{
  _authUser = user;
  if(!user){
    currentUser=null;
    fbReady=true; /* 登入畫面本身不需要任何資料 */
    renderApp();
    return;
  }
  /* 一旦登入，才開始讀取使用者名單（規則允許任何登入者讀取） */
  ensureUsersListener();
  recomputeCurrentUser();
  _maybeReady();
});

/* ── 真實連線狀態偵測（取代原本寫死的「已同步」）──
   刻意延後到下一個事件循環才啟動，且用多層防呆包住，
   確保就算這個功能本身出狀況，也絕對不會拖累到上面的登入流程 */
setTimeout(function(){
  try{
    _db.ref(".info/connected").on("value", function(snap){
      try{
        _online = (snap && snap.val()) !== false; /* 只有明確收到 false 才視為離線 */
        renderApp();
      }catch(e2){}
    });
  }catch(e){ /* 若環境不支援 .info/connected，維持預設顯示已同步 */ }
}, 0);

/* ============================================================
   小工具
   ============================================================ */
function toast(msg){
  let t=document.getElementById("toast-el");
  if(!t){ t=document.createElement("div"); t.id="toast-el";
    t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#26251f;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s";
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity="1";
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.opacity="0",1800);
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function approvedNicknames(){
  const engineers = Object.values(USERS).filter(u=>u.status==="approved").map(u=>u.nickname);
  return [ADMIN_NICKNAME, ...engineers];
}
function pendingCount(){ return Object.values(USERS).filter(u=>u.status==="pending").length; }

/* ============================================================
   新增作業 — 草稿列（確認新增／取消）
   ============================================================ */
let DRAFTS = {}; /* key -> {task, due, persons[]} */
function draftKeyFor(kind,proj,wi){ return kind==="general" ? "__general" : `${proj}__${wi}`; }
function startAddTask(kind,proj,wi){
  const key=draftKeyFor(kind,proj,wi);
  DRAFTS[key] = {kind,proj,wi,task:"",due:todayDueDefault(),persons:[]};
  renderApp();
}
function cancelAddTask(key){
  delete DRAFTS[key];
  renderApp();
}
function updateDraftField(key,field,val){
  if(DRAFTS[key]) DRAFTS[key][field]=val;
}
function confirmAddTask(key){
  const d=DRAFTS[key];
  if(!d) return;
  const taskText=(d.task||"").trim();
  if(!taskText){ toast("請輸入作業內容"); return; }
  if(d.kind==="general"){
    const t={id:newDataId("GENERAL"),task:taskText,due:d.due||todayDueDefault(),persons:d.persons||[],report:"",status:"待執行",delayLocked:false};
    GENERAL.push(t);
    writeGeneral(t);
  } else {
    const t={id:newDataId("TASKS"),proj:d.proj,wi:d.wi,task:taskText,due:d.due||todayDueDefault(),persons:d.persons||[],report:"",status:"待執行",delayLocked:false};
    TASKS.push(t);
    writeTask(t);
  }
  delete DRAFTS[key];
  renderApp();
}
function draftRowHtml(key){
  const d=DRAFTS[key];
  const personsHtml=(d.persons||[]).map((p,i)=>
    `<span class="ptag">${esc(p)}<span class="x" onclick="removeDraftPerson('${key}',${i})">×</span></span>`
  ).join("");
  return `<div class="t-row draft-row">
    ${d.kind==="general"?`<div class="t-cell c-seq">—</div>`:""}
    <div class="t-cell c-task">
      <input class="draft-input" placeholder="作業內容…" value="${esc(d.task)}" oninput="updateDraftField('${key}','task',this.value)">
    </div>
    <div class="t-cell c-due">
      <input type="date" class="draft-due-input" min="${todayISO()}" value="${dueToISO(d.due)}" onchange="updateDraftField('${key}','due',clampDueNotPast(this.value));renderApp()">
    </div>
    <div class="t-cell c-person">
      ${personsHtml}
      <button class="p-add" onclick="openDraftPersonPicker(event,'${key}')">＋</button>
    </div>
    <div class="t-cell c-status"><span class="badge todo">待執行</span></div>
    <div class="t-cell c-report"></div>
    <div class="t-cell c-act-draft">
      <div class="draft-actions">
        <button class="confirm-btn" onclick="confirmAddTask('${key}')">確認新增</button>
        <button class="cancel-btn" onclick="cancelAddTask('${key}')">取消</button>
      </div>
    </div>
  </div>`;
}
function openDraftPersonPicker(evt,key){
  evt.stopPropagation();
  const d=DRAFTS[key]; if(!d) return;
  const names = approvedNicknames();
  const already = d.persons||[];
  const options = names.filter(n=>!already.includes(n));
  let box=document.getElementById("person-pop");
  if(box) box.remove();
  box=document.createElement("div");
  box.id="person-pop";
  box.style.cssText="position:absolute;background:var(--sur);border:1px solid var(--bd2);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:200;min-width:120px;max-height:200px;overflow:auto";
  box.innerHTML = options.length ? options.map(n=>`<div style="padding:6px 12px;font-size:12px;cursor:pointer" onmouseover="this.style.background='var(--sur1)'" onmouseout="this.style.background=''" onclick="addDraftPerson('${key}','${n.replace(/'/g,"\\'")}')">${esc(n)}</div>`).join("")
    : `<div style="padding:6px 12px;font-size:12px;color:var(--tx3)">沒有可加入的人</div>`;
  document.body.appendChild(box);
  const r=evt.target.getBoundingClientRect();
  box.style.left=(r.left+window.scrollX)+"px";
  box.style.top=(r.bottom+window.scrollY+4)+"px";
  setTimeout(()=>{ document.addEventListener("click", function h(e){ if(!box.contains(e.target)){ box.remove(); document.removeEventListener("click",h);} }); },0);
}
function addDraftPerson(key,name){
  const d=DRAFTS[key]; if(!d) return;
  d.persons=d.persons||[]; if(!d.persons.includes(name)) d.persons.push(name);
  const box=document.getElementById("person-pop"); if(box) box.remove();
  renderApp();
}
function removeDraftPerson(key,idx){
  const d=DRAFTS[key]; if(!d||!d.persons) return;
  d.persons.splice(idx,1); renderApp();
}

   任務列（開發專案 / 一般事務工作 共用）

/* 執行狀態欄位：一般使用者顯示唯讀徽章；管理員可用下拉選單自由變更（含直接標記完成→歸檔至歷程） */
function statusCellHtml(t,kind,projId){
  const badgeCls = t.status==="完成"?"done":t.status==="執行中"?"wip":t.status==="延誤"?"late":"todo";
  if(!currentUser || !currentUser.isAdmin){
    return `<span class="badge ${badgeCls} no-print">${t.status}</span>`;
  }
  return `<select class="status-select no-print" onchange="adminChangeStatus('${kind}','${projId||""}','${t.id}',this.value)">
    <option value="待執行" ${t.status==="待執行"?"selected":""}>待執行</option>
    <option value="執行中" ${t.status==="執行中"?"selected":""}>執行中</option>
    <option value="延誤" ${t.status==="延誤"?"selected":""}>延誤</option>
    <option value="完成" ${t.status==="完成"?"selected":""}>完成（歸檔）</option>
  </select>`;
}
function adminChangeStatus(kind,projId,id,newStatus){
  if(!currentUser||!currentUser.isAdmin) return;
  if(newStatus==="完成"){
    if(!confirm("確定要將此任務標記為完成嗎？完成後會從清單移除，改存入「歷程」。")){
      /* 使用者取消：瀏覽器已經把下拉選單「視覺上」切到完成了，
         強制重繪一次，換上全新的下拉選單元素，恢復顯示真實狀態，
         避免舊的選單元素卡在不一致的狀態、後續選擇都沒反應 */
      renderApp();
      return;
    }
    adminComplete(kind,projId,id);
  } else {
    adminSetStatus(kind,id,newStatus);
  }
}

/* 收合/展開狀態：統一用「是否收合」為準，未設定過時套用預設值 */
function isClosed(key, defaultClosed){
  return expandState.hasOwnProperty(key) ? expandState[key] : defaultClosed;
}
function toggleKey(key, defaultClosed){
  expandState[key] = !isClosed(key, defaultClosed);
  renderApp();
}

/* ============================================================
   一般事務工作
   ============================================================ */
function renderGeneralSection(){
  const key="__general";
  const list = GENERAL.filter(taskVisible);
  const closed = hasActiveFilters()
    ? list.length===0 /* 有篩選時：有符合的任務就展開，否則收合 */
    : isClosed(key, true); /* 沒有篩選時：預設收合，即使已有工作也不自動展開 */
  const rows = list.map((t,i)=>taskRowHtml(t,'general','',i+1)).join("");

  const draftKey=draftKeyFor('general');
  const draftRow = DRAFTS[draftKey] ? draftRowHtml(draftKey) : "";
  const addBtn = DRAFTS[draftKey] ? "" : `<div class="add-task-btn" onclick="startAddTask('general')">＋ 新增事務</div>`;

  return `<div class="card section-block sec-wrap ${closed?"closed":""}" data-key="${key}">
    <div class="sec-hd" onclick="toggleKey('${key}',true)">
      <svg class="chev" viewBox="0 0 14 14"><path d="M2 5l5 5 5-5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <span class="sec-title">一般事務工作</span>
      <button class="history-btn danger-outline" onclick="event.stopPropagation();openHistory('__general')">歷程</button>
    </div>
    <div class="sec-body">
      <div class="wi-inner" style="border-top:none;border-left:none;border-right:none;border-radius:0">
        <div class="task-tbl" style="width:100%">
          ${taskTableHeaderHtml(true)}
          ${rows}
          ${draftRow}
          ${addBtn}
        </div>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   開發專案
   ============================================================ */
function taskVisible(t){
  if(activeFilters.status && t.status!==activeFilters.status) return false;
  if(activeFilters.person && !(t.persons||[]).includes(activeFilters.person)) return false;
  return true;
}
function delivStatusOf(proj,wi,deliv){ return DELIV_STATUS[proj+"__"+wi+"__"+deliv] || "待辦"; }
function workitemBadge(proj,wi){
  const w=workitemById(wi);
  const total=w.delivs.length;
  const done=w.delivs.filter(d=>delivStatusOf(proj,wi,d.id)==="完成").length;
  return {done,total};
}
function workitemState(proj,wi){
  const {done,total}=workitemBadge(proj,wi);
  if(done===total) return "done";
  if(done>0) return "active";
  const w=workitemById(wi);
  const anyWip=w.delivs.some(d=>delivStatusOf(proj,wi,d.id)==="進行中");
  return anyWip?"active":"none";
}
function delivIconHtml(st){
  if(st==="完成") return `<div class="deliv-icon done">○</div>`;
  if(st==="進行中") return `<div class="deliv-icon wip">▶</div>`;
  return `<div class="deliv-icon todo">✕</div>`;
}
function workitemHasMatchingTask(proj,wi){
  return TASKS.some(t=>t.proj===proj && t.wi===wi && taskVisible(t));
}
function renderWorkitem(proj,wi){
  const w=workitemById(wi);
  const key=proj+"__"+wi;
  const st=workitemState(proj,wi);
  const closed = hasActiveFilters()
    ? !workitemHasMatchingTask(proj,wi) /* 有篩選時：符合條件就展開，不符合就收合 */
    : isClosed(key, true); /* 沒有篩選時：維持使用者手動/預設收合邏輯 */
  const {done,total}=workitemBadge(proj,wi);
  const dotCls = st==="done"?"done":st==="active"?"active":"";
  const badgeCls = st==="done"?"done":st==="active"?"wip":"";

  const delivHtml = w.delivs.map(d=>{
    const ds=delivStatusOf(proj,wi,d.id);
    return `<div class="deliv-item" onclick="cycleDeliv('${proj}','${wi}','${d.id}')">
      ${delivIconHtml(ds)}
      <span class="deliv-label ${ds==='完成'?'done-tx':''}">${esc(d.label)}</span>
    </div>`;
  }).join("");

  const tasks = TASKS.filter(t=>t.proj===proj && t.wi===wi && taskVisible(t));

  return `<div class="wi-block ${closed?"closed":""}" data-key="${key}">

/* 取消歸檔：把歷程裡的紀錄復原回原本的作業清單，重新變成可編輯、可追蹤的任務
   （僅管理員可操作，跟「標記完成」的權限對稱）*/
function unarchiveHistoryEntry(scopeId, entryKey){
  if(!currentUser||!currentUser.isAdmin) return;
  const list = HISTORY[scopeId];
  if(!list) return;
  const idx = list.findIndex(e=>String(e._key)===String(entryKey));
  if(idx<0) return;
  const e = list[idx];
  if(!confirm(`確定要將「${e.task}」從歷程復原回作業清單嗎？`)) return;

  if(scopeId==="__general"){
    const t = {id:newDataId("GENERAL"), task:e.task, due:todayDueDefault(), persons:e.persons||[], report:e.report||"", status:"待執行", delayLocked:false};
    recomputeOne(t);
    GENERAL.push(t);
    writeGeneral(t);
  } else {
    const t = {id:newDataId("TASKS"), proj:scopeId, wi:e.wi||"", task:e.task, due:todayDueDefault(), persons:e.persons||[], report:e.report||"", status:"待執行", delayLocked:false};
    recomputeOne(t);
    TASKS.push(t);
    writeTask(t);
  }
  list.splice(idx,1);
  removeHistoryEntry(scopeId, entryKey);
  openHistory(scopeId); /* 重新整理彈出視窗內容 */
  renderApp();
  toast("已取消歸檔，任務已復原");
}

function addPerson(kind,taskId,name){

function deleteTask(kind,id){
  if(!confirm("確定要刪除這筆任務？")) return;
  if(kind==="general"){ GENERAL=GENERAL.filter(t=>String(t.id)!==String(id)); removeGeneralRecord(id); }
  else { TASKS=TASKS.filter(t=>String(t.id)!==String(id)); removeTaskRecord(id); }
  renderApp();
}
function clearReport(kind,id){
  const t=findTaskList(kind).find(x=>String(x.id)===String(id));
  if(t){ t.report=""; if(kind==="general") writeGeneral(t); else writeTask(t); renderApp(); }
}
function updateExistingDue(kind,id,isoVal){
  const t=findTaskList(kind).find(x=>String(x.id)===String(id));
  if(!t) return;
  t.due = clampDueNotPast(isoVal);
  recomputeOne(t); /* 截止日期變動可能影響延誤判斷，立即重新計算 */
  if(kind==="general") writeGeneral(t); else writeTask(t);
  renderApp();
}
function adminSetStatus(kind,id,newStatus){
  if(!currentUser||!currentUser.isAdmin) return;
  const t=findTaskList(kind).find(x=>String(x.id)===String(id));
  if(t){ t.status=newStatus; t.delayLocked=(newStatus==="延誤"); if(kind==="general") writeGeneral(t); else writeTask(t); renderApp(); }
}
function adminComplete(kind,proj,id){
  if(!currentUser||!currentUser.isAdmin) return;
  if(kind==="general"){
    const idx=GENERAL.findIndex(t=>String(t.id)===String(id)); if(idx<0) return;
    const t=GENERAL[idx];
    addHistoryEntry("__general", {wiLabel:"",wi:"",task:t.task,due:t.due||"",completedDate:todayStr(),persons:t.persons||[],report:t.report||""});
    GENERAL.splice(idx,1);
    removeGeneralRecord(t.id);
  } else {
    const idx=TASKS.findIndex(t=>String(t.id)===String(id)); if(idx<0) return;
    const t=TASKS[idx];
    const w=workitemById(t.wi);
    addHistoryEntry(t.proj, {wiLabel:w?w.label:"",wi:t.wi||"",task:t.task,due:t.due||"",completedDate:todayStr(),persons:t.persons||[],report:t.report||""});
    TASKS.splice(idx,1);
    removeTaskRecord(t.id);
  }
  renderApp(); toast("已歸檔至歷程");
}
function cycleDeliv(proj,wi,deliv){
  if(!currentUser||currentUser.pending||currentUser.needsNickname) return;
  const key=proj+"__"+wi+"__"+deliv;
  const cur=DELIV_STATUS[key]||"待辦";
  const next = cur==="待辦"?"進行中":cur==="進行中"?"完成":"待辦";
  DELIV_STATUS[key]=next;
  writeDelivStatus(key,next);
  renderApp();
}

/* 欄位即時編輯儲存 (contenteditable blur) */
document.addEventListener("blur", function(e){
  const el=e.target;
  if(!(el instanceof HTMLElement)) return;
  const field=el.dataset && el.dataset.field;
  if(!field) return;
  const row=el.closest("[data-id]"); if(!row) return;
  const id=row.dataset.id; /* id 一律當字串處理，相容舊資料(數字)與新資料(push key字串) */
  const inTasks = TASKS.find(x=>String(x.id)===String(id));
  const list = inTasks ? TASKS : (GENERAL.find(x=>String(x.id)===String(id)) ? GENERAL : null);
  if(!list) return;
  const t=list.find(x=>String(x.id)===String(id));
  if(!t) return;
  const val = el.innerText.trim();
  if(field==="task") t.task=val;
  else if(field==="due") t.due=val;
  else if(field==="report") t.report=val;
  /* 儲存後立即依規則重新判斷該筆任務的執行狀態（延誤一旦鎖定則不受此影響） */
  recomputeOne(t);
  if(list===GENERAL) writeGeneral(t); else writeTask(t);
  /* 延後到下一個事件循環才重繪畫面：
     避免「欄位失焦」跟「點擊同一列的按鈕（更新/刪除）」搶在同一個手勢裡，
     導致畫面在點擊那一瞬間被整個換掉、使按鈕的點擊沒有真正生效 */
  setTimeout(renderApp, 0);
}, true);

/* 專案名稱編輯：獨立處理，因為專案 id 跟任務 id 不同命名空間 */
document.addEventListener("blur", function(e){
  const el=e.target;
  if(!(el instanceof HTMLElement)) return;
  const projId = el.dataset && el.dataset.projRenameId;
  if(!projId) return;
  const proj = PROJECTS.find(p=>p.id===projId);
  if(!proj) return;
  const val = el.innerText.trim();
  if(!val){ el.innerText = proj.name; toast("專案名稱不能空白"); return; }
  if(val!==proj.name && PROJECTS.some(p=>p.name===val)){
    el.innerText = proj.name;
    toast("已有相同名稱的專案");
    return;
  }
  if(val!==proj.name){
    proj.name = val;
    writeProjectRecord(proj);
    setTimeout(renderApp, 0);
  }
}, true);

/* ============================================================
   智慧列印：只展開「符合目前篩選條件、且確實有任務」的區塊，
   完全沒有內容的區塊維持收合（不佔版面），列印結束後自動還原畫面
   ============================================================ */
let _savedExpandStateForPrint = null;
function printSmart(){
  _savedExpandStateForPrint = JSON.parse(JSON.stringify(expandState));

  expandState["__dev"] = false; /* 開發專案區塊本身一律展開 */
  expandState["__general"] = GENERAL.filter(taskVisible).length===0;

  PROJECTS.forEach(p=>{
    expandState["proj_"+p.id] = !projectHasMatchingTask(p.id);
    WORKITEMS.forEach(w=>{
      expandState[p.id+"__"+w.id] = !workitemHasMatchingTask(p.id, w.id);
    });
  });

  renderApp();
  window.print();
}
window.addEventListener("afterprint", function(){
  if(_savedExpandStateForPrint){
    expandState = _savedExpandStateForPrint;
    _savedExpandStateForPrint = null;
    renderApp();
  }
});

/* ============================================================
   登入前置畫面
   ============================================================ */
function renderGate(){
  if(!currentUser){
    return `<div class="gate-screen card">
      <div class="title" style="margin-bottom:16px">先進發展部 專案暨任務管理系統</div>
      <button class="primary" onclick="signIn()">使用 Google 帳號登入</button>
    </div>`;
  }
  if(currentUser.needsNickname){
    return `<div class="gate-screen card">
      <div class="title">設定暱稱</div>
      <p style="font-size:13px;color:var(--tx2)">第一次登入，請輸入您的暱稱（將顯示給其他同仁）</p>
      <input id="nick-input" placeholder="輸入暱稱">
      <button class="primary" onclick="submitNickname()">送出申請</button>
    </div>`;
  }
  if(currentUser.pending){
    return `<div class="gate-screen card">
      <div class="title">審核中</div>
      <p style="font-size:13px;color:var(--tx2)">您的帳號（${esc(currentUser.nickname)}）正在等待管理員核准，核准後即可開始使用。</p>
      <button onclick="signOut()">登出</button>
    </div>`;
  }
  return null;
}
function submitNickname(){
  const val=document.getElementById("nick-input").value.trim();
  if(!val){ toast("請輸入暱稱"); return; }
  const dup = Object.values(USERS).some(u=>u.nickname===val) || val==="管理員" || val===ADMIN_NICKNAME;
  if(dup){ toast("暱稱重複，請重新輸入"); return; }
  const k=currentUser.uid;
  USERS[k]={email:currentUser.email,nickname:val,status:"pending",requestedAt:todayStr()};
  pushUserRecord(k, USERS[k]);
  currentUser.nickname=val; currentUser.pending=true; currentUser.needsNickname=false;
  renderApp();
}

/* ============================================================
   主渲染
   ============================================================ */
/* 除錯輔助：瀏覽器主控台可執行 __debug() 查看目前完整狀態 */
function __debug(){ return {PROJECTS,TASKS,GENERAL,DELIV_STATUS,HISTORY,USERS,currentUser,expandState,activeFilters}; }

let _lastError = null;
function renderApp(){
  const root=document.getElementById("app");
  if(!fbReady){
    root.innerHTML = `載入中…`;
    return;
  }
  const gate=renderGate();
  if(gate){ root.innerHTML=gate; return; }

  /* 重繪整個畫面前，先記住目前聚焦中的輸入欄位（例如搜尋框），
     重繪後把焦點與游標位置還原回去，避免每打一個字整個畫面被替換掉導致失焦 */
  const active = document.activeElement;
  const focusedId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart==="number" ? active.selectionStart : null;
  const selEnd   = active && typeof active.selectionEnd==="number" ? active.selectionEnd   : null;

  root.innerHTML = renderHeader() + renderStats() + renderFilters() + renderGeneralSection() + renderDevSection();
  syncTimelineLines();

  if(focusedId){
    const el = document.getElementById(focusedId);
    if(el){
      el.focus();
      if(selStart!==null && typeof el.setSelectionRange==="function"){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

/* 精確置中時間軸的垂直連接線：水平對齊圓點中心，垂直範圍不超出第一個/最後一個圓點 */
function syncTimelineLines(){
  if(typeof document.querySelectorAll !== "function") return;
  document.querySelectorAll(".wi-timeline").forEach(tl=>{
    const line = tl.querySelector(":scope > .wi-line");
    const dots = tl.querySelectorAll(":scope > .wi-block > .wi-dot");
    if(!line) return;
    if(!dots.length){ line.style.display="none"; return; }
    const tlRect = tl.getBoundingClientRect();
    const first = dots[0].getBoundingClientRect();
    const last = dots[dots.length-1].getBoundingClientRect();
    const centerX = (first.left + first.width/2) - tlRect.left;
    const topY = (first.top + first.height/2) - tlRect.top;
    const botY = (last.top + last.height/2) - tlRect.top;
    line.style.left = (centerX - 0.75) + "px";
    line.style.top = topY + "px";
    line.style.height = Math.max(0, botY - topY) + "px";
    line.style.display = "block";
  });
}

/* 逾時保護：超過 8 秒還沒讀到資料，顯示明確錯誤畫面而不是一直卡住 */
setTimeout(function(){
  if(!fbReady){
    const root=document.getElementById("app");
    root.innerHTML = `<div class="gate-screen card">
      <div class="title" style="color:var(--red-tx)">載入逾時</div>
      <p style="font-size:13px;color:var(--tx2)">資料讀取超過 8 秒沒有回應，可能是網路問題、Firebase 規則設定，或瀏覽器擴充功能（例如廣告攔截器）擋住了必要的請求。</p>
      <p style="font-size:12px;color:var(--tx3)">錯誤代碼：${esc(_lastError||"（沒有收到任何回應，可能連錯誤都沒被回報）")}</p>
      <button class="primary" onclick="location.reload()">重新整理</button>
    </div>`;
  }
}, 8000);
</script>
